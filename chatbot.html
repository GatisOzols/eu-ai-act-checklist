<!--
  Article 50(1) — AI interaction disclosure
  Use when: your product holds a conversation with a user (chatbot, voice assistant, AI support agent)
  Required: clear, distinguishable, at the START of the interaction. Persistent visible indicator during the session.
  Source: Regulation (EU) 2024/1689, Article 50(1)
  Maintainer: Disclos team — https://www.disclos.eu
-->

<!-- Block 1: at the start of the conversation. Show before the first user message. -->
<div role="status" aria-live="polite" class="ai-disclosure ai-disclosure--initial">
  <strong>You are chatting with an AI assistant.</strong>
  <p>Responses are generated by an AI model and may be inaccurate. For decisions with legal, financial, or medical impact, verify with a qualified human.</p>
</div>

<!-- Block 2: persistent indicator inside the chat UI. Keep visible the whole session. -->
<div class="ai-indicator" aria-label="AI chat session indicator">
  <span class="ai-indicator__dot" aria-hidden="true"></span>
  <span class="ai-indicator__label">AI assistant</span>
</div>

<!-- Block 3: footer line attached to every AI-generated message. -->
<footer class="ai-message-footer">Generated by AI</footer>

<style>
  /*
    Minimal styles. Override to match your product's design system.
    Do NOT hide these elements behind hover, scroll, or modal close.
    Article 50(1) requires a "clear and distinguishable" disclosure.
  */
  .ai-disclosure {
    border: 1px solid #d1d5db;
    background: #f9fafb;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .ai-disclosure strong { display: block; margin-bottom: 4px; }
  .ai-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 999px;
    background: #eef2ff;
    color: #3730a3;
  }
  .ai-indicator__dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .ai-message-footer {
    font-size: 11px;
    color: #6b7280;
    margin-top: 4px;
  }
</style>
